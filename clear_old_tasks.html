<!DOCTYPE html>
<html>
<head>
    <title>Clear Old Custom Tasks</title>
</head>
<body>
    <h1>Clear Old Custom Tasks</h1>
    <button onclick="clearOldTasks()">Clear Old Custom Tasks (Keep Defaults)</button>
    <div id="output"></div>
    
    <script>
        function clearOldTasks() {
            const today = new Date().toISOString().split('T')[0];
            const key = `daily_goals_tasks_${today}`;
            const data = localStorage.getItem(key);
            
            if (!data) {
                document.getElementById('output').innerHTML = '<p>No tasks found for today.</p>';
                return;
            }
            
            const tasks = JSON.parse(data);
            
            // Keep only default tasks (water, steps, protein, workout)
            const defaults = ['water', 'steps', 'protein', 'workout'];
            const filtered = tasks.filter(t => defaults.includes(t.id));
            
            localStorage.setItem(key, JSON.stringify(filtered));
            
            document.getElementById('output').innerHTML = '<p style="color: green;">✅ Old custom tasks cleared! Refresh your app.</p>';
        }
    </script>
</body>
</html>
